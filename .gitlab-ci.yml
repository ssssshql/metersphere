image: docker:latest

services:
  - docker:dind

variables:
  # Docker 守护进程配置
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # 默认镜像标签。
  # 在 GitLab 界面点击 "Run pipeline" 时，你可以在 "Variables" 区域看到并修改这个变量。
  IMAGE_TAG: "latest"

stages:
  - build-and-push

build-push-job:
  stage: build-and-push
  # 规则配置：
  # 1. 允许通过 Web 界面 (Run pipeline) 触发
  # 2. 允许手动触发 (Manual)
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
  
  before_script:
    # 检查必要的变量是否存在
    - |
      if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "Error: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN variables must be set in CI/CD Settings"
        exit 1
      fi
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  script:
    - echo "Building Docker image with tag: $IMAGE_TAG"
    - docker build -f Dockerfile.buildjar -t "$DOCKERHUB_USERNAME/metersphere:$IMAGE_TAG" .
    - echo "Pushing image to Docker Hub..."
    - docker push "$DOCKERHUB_USERNAME/metersphere:$IMAGE_TAG"
    - echo "Successfully pushed $DOCKERHUB_USERNAME/metersphere:$IMAGE_TAG"
