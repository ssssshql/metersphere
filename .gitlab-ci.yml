image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: "latest"

stages:
  - build-and-push

build-push-job:
  stage: build-and-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual

  before_script:
    - 'if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then echo "Error: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN variables must be set"; exit 1; fi'
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  script:
    - echo "Building Docker image with tag $IMAGE_TAG"
    - docker build -f Dockerfile.buildjar -t "$DOCKERHUB_USERNAME/metersphere:$IMAGE_TAG" .
    - echo "Pushing image to Docker Hub..."
    - docker push "$DOCKERHUB_USERNAME/metersphere:$IMAGE_TAG"
    - echo "Successfully pushed $DOCKERHUB_USERNAME/metersphere:$IMAGE_TAG"
